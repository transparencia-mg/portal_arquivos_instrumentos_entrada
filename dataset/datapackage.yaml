name: portal_arquivos_instrumentos_entrada
owner_org: secretaria-geral-do-estado-de-minas-gerais
profile: data-package
resources:
  - description: Insira a descrição/explicação detalhada deste recurso.
    dialect:
      delimiter: ;
    encoding: utf-8-sig
    format: csv
    hashing: md5
    name: arquivos_instrumentos_entrada
    path: data/arquivos_instrumentos_entrada.csv
    profile: tabular-data-resource
    schema:
      fields:
        - name: codigo_siafi
          type: integer
          description: Número de identificação do instrumento no Sistema Integrado de Administração Financeira (SIAFI).
        - name: codigo_sigcon
          type: string
          description: Número de identificação do instrumento no Sistema de Gestão de Convênios, Portarias e Instrumentos Congêneres – Entrada (SIGCON-Entrada).
        - name: codigo_plano_de_trabalho
          type: string
          description: Número de identificação do plano de trabalho do instrumento no SIGCON-Entrada. 
        - name: instrumento
          type: string
          description: Tipo de instrumento de entrada de recursos, como convênio, acordo, ajuste, portaria, transferência especial ou outro instrumento congênere
        - name: tipo_de_documento
          type: string
          description: tipo de arquivo como termmo de convênio, plano de trabalaho, termo aditivo, plano de ação e outros
        - name: informacao
          type: string
          description: Link para acesso ao documento.
    scheme: file
    title: Arquivos dos Convênios de Entrada e Instrumentos Congêneres
title: Arquivos dos Convênios de Entrada e Instrumentos Congêneres
